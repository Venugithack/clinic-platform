project_id = "clinic-platform"

[api]
enabled = true
port = 54321
# `app` is exposed alongside `public` because the state transitions live there
# (lib/db calls them with .schema('app')). Keeping them out of `public` means
# the boundary between "a read under RLS" and "a state change in a transaction"
# is visible in the client call, not just in a comment.
schemas = ["public", "app"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# The device holds a long-lived session and the PIN holds the identity
# (TABLET.md §5), so the refresh window is deliberately generous: staff should
# never be asked for a password on a shared tablet.
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

# How the tablet obtains the `authenticated` role that every grant targets.
#
# On here so that local development and a hosted project run the SAME code
# path. Before this, local dev was handed a hand-minted JWT that already
# carried the role, which worked locally and failed on the first hosted request
# — the bug stayed invisible precisely because the two environments differed.
# On the hosted project this is Auth → Providers → Anonymous sign-ins.
#
# `enable_signup = false` above still stands: there is no public registration.
# See lib/db/index.ts for what an anonymous session without a PIN can actually
# reach, which is three read-only things and an unlock that refuses.
enable_anonymous_sign_ins = true

[analytics]
enabled = false
