name: CI

# The previous workflow tested the application this repository used to hold: a
# static Next export over Supabase, with a 34-file pgTAP suite and a restore
# drill against a bare Postgres 17. That application is gone (it is still in the
# history, up to f47273c) and none of those jobs describe what is here now.
#
# What is here now is a Node server that talks to Postgres. So this checks the
# three things that can be checked without a database — the types, the unit
# tests, and that it builds — and deliberately claims nothing about the rest.
# A CI that pretends to cover the data layer is worse than one that admits it
# does not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · tests · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The database connection is created on first use, not on import, so the
      # build needs no DATABASE_URL. If that ever regresses, this job is where
      # it shows up — as "Failed to collect page data", which is exactly how it
      # showed up the first time.
      - name: Build
        run: npm run build
