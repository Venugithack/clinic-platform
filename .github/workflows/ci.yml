name: CI

# The previous workflow tested the application this repository used to hold: a
# Next server over Supabase, with a 34-file pgTAP suite and a restore drill
# against a bare Postgres 17. That application is gone — it survives only in the
# history — and none of those jobs describe what is here now.
#
# What is here now is two halves that never share a process:
#
#   the page      static files. `next build` writes plain HTML, CSS and
#                 JavaScript to out/ and Cloudflare serves them. Nothing runs
#                 behind them, which is the whole reason the hosting is free.
#   the backend   Deno. The Edge Functions in supabase/functions/, deployed
#                 beside the database and talking to Postgres directly.
#
# So this job checks the four things that can be checked without a database —
# the page's types, the unit tests, that the export builds, and the backend's
# types — and deliberately claims nothing about the rest.
#
# What that leaves uncovered is worth saying plainly, because it is most of the
# clinic. There is no database test suite in this repository and no end-to-end
# test: nothing here applies a migration, proves a query names a column that
# exists, or signs a tablet in. The two files in tests/ are the entire automated
# suite. A CI that pretends to cover the data layer is worse than one that
# admits it does not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · tests · build · edge functions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `tsc --noEmit` over the page: app/, components/, lib/ and tests/.
      # It does NOT cover supabase/ — tsconfig.json excludes it. That gap is
      # what the last step of this job exists to close; see the note there.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Nothing here needs a database or a secret, and this is no longer the
      # place a missing DATABASE_URL would show up: a static export has no
      # server, so there is no request-time code to run at build and nothing
      # that could open a connection. The "Failed to collect page data" failure
      # this comment used to warn about cannot happen without a server to
      # collect from.
      #
      # It does mean the out/ produced here is not deployable.
      # NEXT_PUBLIC_FUNCTIONS_URL is baked into the bundle at build time and is
      # unset on this runner, so these pages would call a relative path and
      # reach nothing. This step proves the code compiles, not that the artifact
      # works.
      - name: Build
        run: npm run build

      # ── THE BACKEND, WHICH NOTHING ABOVE LOOKS AT ────────────────────────
      #
      # `npm run typecheck` is `tsc --noEmit`, and tsconfig.json's "exclude"
      # list contains "supabase". So every Edge Function, _shared/auth.ts,
      # _shared/commands.ts and _shared/snapshot.ts were checked by nothing at
      # all, and typecheck reported clean regardless. That is not a hypothetical
      # gap: the first run of this step found two errors sitting in the branch
      # with CI green — a type used and never imported, and an import missing
      # its `.ts` extension. Neither is subtle. Nothing was looking.
      #
      # Deno rather than tsc because this code is Deno — Deno.serve, `npm:`
      # specifiers and `.ts` on its own imports — none of which tsc resolves.
      # It is the same compiler either way; only Deno knows where the modules
      # are.
      - uses: denoland/setup-deno@v2
        with:
          # Pinned exactly, unlike node-version above, because the TypeScript
          # compiler doing the checking ships inside Deno. A floating pin means
          # this step's verdict can change on a morning nobody touched the code.
          deno-version: v2.9.6

      # --node-modules-dir=none matters and is easy to drop. `npm ci` ran
      # earlier in this job, so Deno finds the repository root's package.json
      # and node_modules — the page's, not the functions' — and tries to resolve
      # `npm:postgres` and `npm:csv-parse` out of a tree that has never held
      # either. It fails before it typechecks a line. `none` sends Deno to its
      # own cache and the registry, which is where the deployed function gets
      # them too.
      #
      # globstar so orphaned files are checked as well: `deno check` follows the
      # import graph, so without it a file nothing imports yet is a file nobody
      # compiles.
      #
      # Last in the job on purpose. It is the newest and least settled step, and
      # a failure here should not cost you the tests-and-build result.
      - name: Typecheck the Edge Functions
        shell: bash
        run: |
          shopt -s globstar
          if ! deno check --node-modules-dir=none supabase/functions/**/*.ts; then
            echo "::error title=Edge Functions do not typecheck::npm run typecheck cannot see supabase/functions — tsconfig.json excludes it. See the deno check output above."
            echo
            echo "The Edge Functions do not typecheck."
            echo
            echo "Nothing else in this job covers them, so 'npm run typecheck'"
            echo "can pass with the whole backend broken. Reproduce locally with"
            echo "the identical command:"
            echo
            echo "  shopt -s globstar"
            echo "  deno check --node-modules-dir=none supabase/functions/**/*.ts"
            echo
            echo "Deno is not a dependency of this repository; install it from"
            echo "https://deno.com if you do not have it."
            echo
            exit 1
          fi

  # ── THE DATABASE, WHICH NOTHING ABOVE TOUCHES EITHER ──────────────────────
  #
  # The job above deliberately claims nothing about the data layer, and until
  # Slice 0 that was the only honest position available: there was no way to
  # apply a migration or run a query without pointing at the clinic's live
  # database. There is now. This job builds the schema from
  # supabase/migrations/ into a throwaway PostgreSQL 17 and runs the
  # characterization suite against it — the real Edge Function code, the real
  # SQL, no mocks.
  #
  # It is a separate job rather than more steps on the one above because it is
  # the slower half and because a database failure and a typecheck failure are
  # different news. Both must pass.
  database:
    name: migrations · characterization suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      # Named and ported to match what scripts/staging/guard.mjs will accept.
      # The guard is an allowlist of loopback hosts and scratch database names,
      # and it applies here exactly as it does on a developer's machine — CI is
      # not a reason to have a second, weaker rule.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: staging
          POSTGRES_DB: clinic_staging
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STAGING_DB_URL: postgresql://postgres:staging@127.0.0.1:55432/clinic_staging

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Applies every migration inside a transaction and then checks that the
      # tables landed in `jmc`. Both halves matter: `set local search_path` at
      # the top of each migration file is a no-op outside a transaction, and a
      # run without one silently builds the whole clinic in `public` — where,
      # on the shared production database, the retired application lives and
      # eight table names collide exactly.
      - name: Build the schema from supabase/migrations/
        run: node scripts/staging/apply-migrations.mjs

      # The suite loads supabase/functions/_shared/*.ts under Node and runs it
      # against that schema. Files run one at a time: they share one database
      # and each resets it.
      - name: Characterization suite
        run: npm run test:db

      # The backup this clinic depends on, rehearsed against the scratch
      # database rather than the live one. It runs the same two scripts the
      # nightly Backup workflow runs, so a break in them is caught here on a
      # pull request instead of at 22:00 IST against production.
      - name: Install the PostgreSQL 17 client
        run: |
          ./scripts/ci-pgdg.sh
          sudo apt-get install -y postgresql-client-17

      - name: Restore drill
        env:
          BACKUP_DB_URL: postgresql://postgres:staging@127.0.0.1:55432/clinic_staging
          PGPASSWORD: staging
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: postgres
          PGDATABASE: clinic_staging
          SCRATCH_DB: clinic_restore_drill
        run: ./scripts/db-restore-drill.sh

  # ── THE SCREENS, WHICH NEITHER JOB ABOVE CLICKS ───────────────────────────
  #
  # `database` runs the clinic's logic; this runs its screens. Slices 1 to 5
  # each found at least one defect that only a browser could see — a
  # doctor-only account shown no register button, a rail with no Vitals
  # station, a counter with no arithmetic on it, a consultation fee that agreed
  # with the configured fee by coincidence — and none of those had a failing
  # test until somebody opened the page.
  #
  # ── WHY THE BROWSER IS PINNED, AND WHY THAT MATTERS MORE THAN USUAL ───────
  #
  # `ubuntu-24.04` ships a Chrome whose version moves without anybody asking.
  # A suite that clicks real controls and measures real layout is a suite whose
  # verdict can change on a morning nobody touched the code, and the brief is
  # explicit: do not add a knowingly flaky required check. So Chrome is
  # installed at a fixed version and handed to the driver by path, the same way
  # `deno-version` is pinned above for the same reason.
  #
  # ── WHAT HAS NOT BEEN VERIFIED ───────────────────────────────────────────
  #
  # This job has never run. Nothing in this programme has been pushed, so no
  # runner has executed it, and the exact behaviour of Chrome headless on a
  # GitHub runner — sandbox flags, missing fonts, the shared-memory size that
  # makes headless Chrome fall over on a container — is not something a
  # developer's machine can answer. It is written to be correct and is recorded
  # here as unverified. Make it a required check on the branch only after it
  # has been green twice; until then it is a job that reports, not a gate.
  browser:
    name: browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # No `services: postgres` here, unlike the job above, and the difference is
    # not an oversight. `npm run test:browser` runs scripts/staging/up.mjs,
    # which creates its OWN `jmc-staging` container on port 55432 — that is how
    # a developer runs it and running the same thing in CI is the point. A
    # service container bound to the same host port would collide, and
    # `docker run` would fail before a single migration was applied. Docker is
    # present on `ubuntu-24.04`, so up.mjs has what it needs.
    #
    # STAGING_DB_URL is not set here for the same reason: up.mjs builds the URL
    # and hands it to every child process, and a second, differently-spelled
    # copy in this file is a copy that goes stale.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pinned exactly. `stable` would be a moving target and this job's whole
      # value is that a red run means the code changed.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: '131.0.6778.85'

      - name: Browser journeys
        # The driver takes the browser by path rather than discovering one, so
        # the pin above is load-bearing rather than decorative.
        env:
          AGENT_BROWSER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser

      # The screenshots and the page it was looking at when something failed.
      # A browser failure with no artifact is a bug report that says "it did
      # not work", which nobody can act on.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            out/
            /tmp/agent-browser-*
          retention-days: 7
          if-no-files-found: ignore
