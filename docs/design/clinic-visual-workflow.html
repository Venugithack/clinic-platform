<style>
  #clinic-flow {
    --jmc-bg: light-dark(#f0f5f3, #14221e);
    --jmc-sheet: light-dark(#ffffff, #1c2d27);
    --jmc-ink: light-dark(#213b32, #e6f1eb);
    --jmc-muted: light-dark(#586e63, #b2c6ba);
    --jmc-line: light-dark(#d6e2db, #3d5649);
    --jmc-green: light-dark(#176751, #9bd3b9);
    --jmc-on-green: light-dark(#ffffff, #102a1d);
    --jmc-soft: light-dark(#e6f2eb, #294737);
    --jmc-amber: light-dark(#815817, #f1cd89);
    --jmc-amber-bg: light-dark(#fff4dc, #41341c);
    --jmc-red: light-dark(#a62d42, #ffb5c3);
    --jmc-red-bg: light-dark(#fff0f3, #452530);
    font: 400 15px/1.5 'Archivo', 'Segoe UI', sans-serif;
    color: var(--jmc-ink); width: 100%; container-type: inline-size;
  }
  #clinic-flow * { box-sizing: border-box; }
  #clinic-flow [hidden] { display: none !important; }
  #clinic-flow h2, #clinic-flow h3, #clinic-flow p { margin: 0; }
  #clinic-flow h2 { font: 600 24px/1.25 'Archivo', 'Segoe UI', sans-serif; letter-spacing: -.03em; }
  #clinic-flow h3 { font: 600 17px/1.4 'Archivo', 'Segoe UI', sans-serif; }
  #clinic-flow button, #clinic-flow input, #clinic-flow select, #clinic-flow textarea { font-family: inherit; }
  #clinic-flow button { cursor: pointer; }
  #clinic-flow button:disabled { cursor: default; opacity: .65; }
  #clinic-flow .jmc-demo { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-bottom: 10px; font-size: 12px; color: var(--jmc-muted); }
  #clinic-flow .jmc-announcement { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #clinic-flow .jmc-window { background: var(--jmc-bg); border: 1px solid var(--jmc-line); border-radius: 12px; overflow: clip; }
  #clinic-flow .jmc-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 15px 22px; background: var(--jmc-sheet); }
  #clinic-flow .jmc-brand { display: flex; align-items: center; gap: 11px; }
  #clinic-flow .jmc-brand img { width: 50px; height: 50px; object-fit: contain; border-radius: 10px; background: #fff; }
  #clinic-flow .jmc-brand strong { display: block; font-size: 16px; font-weight: 600; }
  #clinic-flow .jmc-muted { color: var(--jmc-muted); }
  #clinic-flow .jmc-small { font-size: 12px; }
  #clinic-flow .jmc-role { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--jmc-muted); }
  #clinic-flow select { min-height: 44px; min-width: 0; padding: 8px 10px; border: 1px solid var(--jmc-line); border-radius: 7px; color: var(--jmc-ink); background: var(--jmc-sheet); font-size: 16px; }
  #clinic-flow .jmc-nav { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 5px; padding: 4px 20px 12px; background: var(--jmc-sheet); border-bottom: 1px solid var(--jmc-line); }
  #clinic-flow .jmc-nav button { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 10px; border: 1px solid transparent; border-radius: 8px; color: var(--jmc-muted); background: transparent; font-size: 14px; font-weight: 600; }
  #clinic-flow .jmc-nav button[aria-current='page'] { background: var(--jmc-soft); color: var(--jmc-green); border-color: var(--jmc-line); }
  #clinic-flow .jmc-nav svg { width: 23px !important; height: 23px !important; }
  #clinic-flow .jmc-content { padding: 22px; }
  #clinic-flow .jmc-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  #clinic-flow .jmc-heading p { color: var(--jmc-muted); font-size: 13px; margin-top: 6px; }
  #clinic-flow .jmc-icon { flex: 0 0 auto; width: 19px !important; height: 19px !important; }
  #clinic-flow .jmc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 14px; border: 1px solid var(--jmc-line); border-radius: 7px; color: var(--jmc-ink); background: var(--jmc-sheet); font-size: 14px; font-weight: 600; text-align: center; }
  #clinic-flow .jmc-primary { color: var(--jmc-on-green); background: var(--jmc-green); border-color: var(--jmc-green); }
  #clinic-flow .jmc-badge { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 4px 9px; border-radius: 5px; color: var(--jmc-green); background: var(--jmc-soft); font-size: 12px; font-weight: 600; }
  #clinic-flow .jmc-badge svg { width: 15px !important; height: 15px !important; }
  #clinic-flow .jmc-wait { color: var(--jmc-amber); background: var(--jmc-amber-bg); }
  #clinic-flow .jmc-alert { color: var(--jmc-red); background: var(--jmc-red-bg); }
  #clinic-flow .jmc-patient { display: flex; align-items: center; flex-wrap: wrap; gap: 13px; padding: 16px; background: var(--jmc-sheet); border: 1px solid var(--jmc-line); border-left: 4px solid var(--jmc-green); border-radius: 9px; margin-bottom: 16px; }
  #clinic-flow .jmc-token { display: grid; place-content: center; flex-shrink: 0; text-align: center; width: 54px; min-height: 57px; border-radius: 8px; color: var(--jmc-green); background: var(--jmc-soft); font-size: 24px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
  #clinic-flow .jmc-token small { font-size: 11px; font-weight: 400; line-height: 1.7; }
  #clinic-flow .jmc-person { flex: 1; min-width: 135px; }
  #clinic-flow .jmc-person strong { display: block; font-size: 18px; font-weight: 600; }
  #clinic-flow .jmc-person p { margin-top: 4px; color: var(--jmc-muted); font-size: 12px; }
  #clinic-flow .jmc-journey { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); list-style: none; padding: 0; margin: 0 0 21px; }
  #clinic-flow .jmc-journey li { position: relative; display: grid; justify-items: center; gap: 7px; color: var(--jmc-muted); font-size: 12px; }
  #clinic-flow .jmc-journey li::after { content: ''; position: absolute; height: 2px; background: var(--jmc-line); width: calc(100% - 46px); left: calc(50% + 23px); top: 18px; }
  #clinic-flow .jmc-journey li:last-child::after { display: none; }
  #clinic-flow .jmc-step { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--jmc-line); border-radius: 50%; background: var(--jmc-sheet); }
  #clinic-flow .jmc-journey [data-step='done'] { color: var(--jmc-green); }
  #clinic-flow .jmc-journey [data-step='done'] .jmc-step { background: var(--jmc-soft); border-color: var(--jmc-soft); }
  #clinic-flow .jmc-journey [data-step='active'] { color: var(--jmc-green); font-weight: 600; }
  #clinic-flow .jmc-journey [data-step='active'] .jmc-step { color: var(--jmc-on-green); background: var(--jmc-green); border-color: var(--jmc-green); }
  #clinic-flow .jmc-journey [data-step='pending'] .jmc-step { color: var(--jmc-amber); background: var(--jmc-amber-bg); border-color: var(--jmc-amber-bg); }
  #clinic-flow .jmc-sheet { min-width: 0; background: var(--jmc-sheet); border: 1px solid var(--jmc-line); border-radius: 9px; }
  #clinic-flow .jmc-section { padding: 18px; }
  #clinic-flow .jmc-section + .jmc-section { border-top: 1px solid var(--jmc-line); }
  #clinic-flow .jmc-section-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  #clinic-flow .jmc-section-heading h3 { display: flex; align-items: center; gap: 9px; }
  #clinic-flow .jmc-section-heading h3 svg { color: var(--jmc-green); }
  #clinic-flow .jmc-field { display: block; color: var(--jmc-muted); font-size: 13px; min-width: 0; }
  #clinic-flow .jmc-field + .jmc-field { margin-top: 13px; }
  #clinic-flow .jmc-field input, #clinic-flow .jmc-field textarea { display: block; min-height: 46px; width: 100%; padding: 10px 11px; margin-top: 5px; border: 1px solid var(--jmc-line); border-radius: 7px; color: var(--jmc-ink); background: var(--jmc-sheet); font-size: 16px; line-height: 1.4; }
  #clinic-flow .jmc-field textarea { resize: vertical; }
  #clinic-flow input::placeholder, #clinic-flow textarea::placeholder { color: var(--jmc-muted); opacity: 1; }
  #clinic-flow .jmc-pair { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
  #clinic-flow .jmc-pair .jmc-field { margin: 0; }
  #clinic-flow .jmc-vital-label { display: flex; align-items: center; gap: 7px; }
  #clinic-flow .jmc-vital-label svg { width: 17px !important; height: 17px !important; color: var(--jmc-green); }
  #clinic-flow summary { display: flex; align-items: center; gap: 8px; min-height: 46px; color: var(--jmc-green); cursor: pointer; font-size: 14px; font-weight: 600; }
  #clinic-flow summary::after { content: '+'; margin-left: auto; font-size: 21px; font-weight: 400; }
  #clinic-flow details[open] > summary::after { content: '−'; }
  #clinic-flow .jmc-details { padding: 4px 18px; }
  #clinic-flow .jmc-details[open] { padding-bottom: 16px; }
  #clinic-flow .jmc-details p { font-size: 13px; color: var(--jmc-muted); }
  #clinic-flow .jmc-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  #clinic-flow .jmc-chips button { min-height: 44px; padding: 8px 11px; background: var(--jmc-sheet); border: 1px solid var(--jmc-line); border-radius: 7px; color: var(--jmc-ink); font-size: 14px; }
  #clinic-flow .jmc-chips button[aria-pressed='true'] { background: var(--jmc-soft); color: var(--jmc-green); border-color: var(--jmc-green); }
  #clinic-flow .jmc-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 22px; border-top: 1px solid var(--jmc-line); background: var(--jmc-sheet); }
  #clinic-flow .jmc-footer-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #clinic-flow .jmc-footer .jmc-primary { min-height: 50px; }
  #clinic-flow .jmc-save-status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--jmc-muted); }
  #clinic-flow .jmc-save-status[data-saved='true'] { color: var(--jmc-green); font-weight: 600; }
  #clinic-flow .jmc-outcome { display: grid; justify-items: center; padding: 28px 22px 24px; background: var(--jmc-sheet); border: 1px solid var(--jmc-line); border-radius: 10px; text-align: center; }
  #clinic-flow .jmc-outcome-mark { display: grid; place-items: center; width: 86px; height: 86px; border-radius: 50%; background: var(--jmc-soft); color: var(--jmc-green); margin-bottom: 17px; }
  #clinic-flow .jmc-outcome-mark svg { width: 44px !important; height: 44px !important; stroke-width: 2.6; }
  #clinic-flow .jmc-outcome-mark.jmc-wait { color: var(--jmc-amber); background: var(--jmc-amber-bg); }
  #clinic-flow .jmc-outcome h2 { font-size: 27px; margin-bottom: 8px; }
  #clinic-flow .jmc-outcome-patient { font-size: 16px; font-weight: 600; }
  #clinic-flow .jmc-outcome-sub { margin-top: 6px; color: var(--jmc-muted); font-size: 14px; max-width: 42ch; }
  #clinic-flow .jmc-facts { width: 100%; max-width: 420px; padding: 0; margin: 22px 0 0; text-align: left; }
  #clinic-flow .jmc-facts > div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--jmc-line); }
  #clinic-flow .jmc-facts dt { color: var(--jmc-muted); font-size: 13px; }
  #clinic-flow .jmc-facts dd { margin: 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #clinic-flow .jmc-pending { display: flex; align-items: flex-start; gap: 9px; width: 100%; max-width: 420px; margin-top: 15px; padding: 12px; border-radius: 7px; background: var(--jmc-amber-bg); color: var(--jmc-amber); text-align: left; font-size: 14px; }
  #clinic-flow .jmc-pending svg { margin-top: 2px; }
  #clinic-flow .jmc-next { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--jmc-line); border-radius: 9px; background: var(--jmc-sheet); }
  #clinic-flow .jmc-next-person { display: flex; align-items: center; gap: 11px; }
  #clinic-flow .jmc-avatar { display: grid; place-items: center; width: 42px; height: 42px; flex-shrink: 0; background: var(--jmc-soft); color: var(--jmc-green); border-radius: 50%; }
  #clinic-flow .jmc-next strong { font-size: 15px; font-weight: 600; }
  #clinic-flow .jmc-next p { font-size: 12px; color: var(--jmc-muted); }
  #clinic-flow .jmc-queue-row { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; align-items: center; gap: 13px; padding: 17px; border-bottom: 1px solid var(--jmc-line); }
  #clinic-flow .jmc-queue-row:last-child { border-bottom: 0; }
  #clinic-flow .jmc-queue-row .jmc-token { width: 46px; min-height: 48px; font-size: 22px; }
  #clinic-flow .jmc-queue-row p { color: var(--jmc-muted); font-size: 12px; margin: 4px 0 7px; }
  #clinic-flow .jmc-queue-done { display: grid; place-items: center; width: 46px; height: 48px; color: var(--jmc-green); background: var(--jmc-soft); border-radius: 8px; }
  #clinic-flow .jmc-queue-done svg { width: 26px !important; height: 26px !important; }
  #clinic-flow .jmc-work { display: grid; grid-template-columns: minmax(0,1fr) 190px; gap: 18px; align-items: start; }
  #clinic-flow .jmc-bill { padding: 4px 0; }
  #clinic-flow .jmc-bill h3 { display: flex; gap: 8px; align-items: center; margin-bottom: 13px; }
  #clinic-flow .jmc-money-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--jmc-line); font-size: 14px; }
  #clinic-flow .jmc-money-row strong { font-weight: 600; font-variant-numeric: tabular-nums; }
  #clinic-flow .jmc-money-row.jmc-total { font-size: 18px; border: 0; padding-top: 16px; }
  #clinic-flow .jmc-medicine { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  #clinic-flow .jmc-medicine .jmc-avatar { width: 48px; height: 48px; border-radius: 10px; }
  #clinic-flow .jmc-medicine strong { font-size: 15px; }
  #clinic-flow .jmc-medicine p { font-size: 12px; color: var(--jmc-muted); }
  #clinic-flow .jmc-error { display: flex; gap: 10px; align-items: flex-start; padding: 13px; margin-bottom: 15px; background: var(--jmc-red-bg); color: var(--jmc-red); border-radius: 8px; font-size: 14px; }
  #clinic-flow .jmc-empty { display: grid; justify-items: center; gap: 12px; padding: 28px 18px; text-align: center; }
  #clinic-flow .jmc-empty > svg { width: 52px !important; height: 52px !important; color: var(--jmc-green); }
  #clinic-flow .jmc-bed-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
  #clinic-flow .jmc-bed { padding: 20px; background: var(--jmc-sheet); border: 1px solid var(--jmc-line); border-radius: 9px; }
  #clinic-flow .jmc-bed > svg { width: 36px !important; height: 36px !important; color: var(--jmc-green); margin-bottom: 12px; }
  #clinic-flow .jmc-bed p { margin: 6px 0 11px; font-size: 13px; color: var(--jmc-muted); }
  #clinic-flow .jmc-busy svg { animation: jmc-turn .8s linear infinite; }
  @keyframes jmc-turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #clinic-flow .jmc-busy svg { animation: none; } }
  @container (max-width: 600px) {
    #clinic-flow .jmc-work { grid-template-columns: 1fr; }
    #clinic-flow .jmc-content { padding: 16px; }
    #clinic-flow .jmc-top, #clinic-flow .jmc-footer { padding: 15px 16px; }
    #clinic-flow .jmc-nav { padding: 3px 12px 11px; }
    #clinic-flow .jmc-nav button { flex-direction: column; gap: 5px; }
  }
  @container (max-width: 420px) {
    #clinic-flow .jmc-content { padding: 12px; }
    #clinic-flow .jmc-role { width: 100%; justify-content: space-between; }
    #clinic-flow .jmc-role select { flex: 1; }
    #clinic-flow .jmc-section { padding: 15px; }
    #clinic-flow .jmc-queue-row { grid-template-columns: 42px minmax(0,1fr); gap: 11px; padding: 15px; }
    #clinic-flow .jmc-queue-row .jmc-btn { grid-column: 2; justify-self: start; }
    #clinic-flow .jmc-pair, #clinic-flow .jmc-bed-grid { grid-template-columns: 1fr; }
    #clinic-flow .jmc-footer-actions { width: 100%; }
    #clinic-flow .jmc-footer-actions button { flex: 1; }
    #clinic-flow .jmc-next { flex-wrap: wrap; }
    #clinic-flow .jmc-next > button { width: 100%; }
    #clinic-flow .jmc-outcome { padding: 24px 15px 20px; }
    #clinic-flow .jmc-outcome h2 { font-size: 24px; }
  }
</style>

</div>
<script>
(() => {
  const root = document.getElementById('clinic-flow');
  const nav = root.querySelector('.jmc-nav');
  const content = root.querySelector('.jmc-content');
  const footer = root.querySelector('.jmc-footer');
  const roleSelect = root.querySelector('select');
  const people = [
    { name: 'Kavitha R.', age: 42, sex: 'Female', token: 12, allergy: 'Penicillin allergy', wait: '8 min' },
    { name: 'Senthil K.', age: 35, sex: 'Male', token: 13, allergy: 'Allergy status not recorded', wait: '5 min' },
    { name: 'Meena S.', age: 58, sex: 'Female', token: 14, allergy: 'No known allergies recorded', wait: '3 min' }
  ];
  const fee = 300;
  const patientStates = people.map(() => ({
    draft: { complaint: 'Follow-up visit', diagnosis: '', note: '', followUp: '7 days', saved: false },
    vitals: { bp: '', temperature: '', pulse: '', spo2: '', reason: '' },
    counter: { quantity: 10, method: 'Cash', received: 320, cash: 160, upi: 160 },
    outcomes: { doctor: null, nurse: null, pharmacy: null }
  }));
  // Open on an example result so the completion treatment is visible immediately.
  patientStates[0].outcomes.doctor = { pending: false };
  patientStates[0].draft.saved = true;
  const navigation = {
    doctor: [['Today','calendar-days'], ['Consult','stethoscope'], ['Patients','users']],
    nurse: [['Queue','users'], ['Vitals','heart-pulse'], ['Observation','bed-single']],
    pharmacy: [['Prescriptions','clipboard-list'], ['Counter','pill'], ['Stock','package']]
  };
  let role = 'doctor';
  let view = 'Result';
  let selected = 0;
  let busy = false;
  const escape = value => String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
  const icon = name => `<i data-lucide="${name}" class="jmc-icon" aria-hidden="true"></i>`;
  const button = (label, action, name, primary = false, extra = '') => `<button type="button" class="jmc-btn ${primary ? 'jmc-primary' : ''}" data-action="${action}" ${extra}>${name ? icon(name) : ''}<span>${label}</span></button>`;
  const badge = (label, name = 'check', tone = '') => `<span class="jmc-badge ${tone}">${icon(name)}${label}</span>`;
  const heading = (title, subtitle = '', action = '') => `<div class="jmc-heading"><div><h2>${title}</h2>${subtitle ? `<p>${subtitle}</p>` : ''}</div>${action}</div>`;
  const money = number => `₹${Number(number).toLocaleString('en-IN', { maximumFractionDigits: 2 })}`;
  const state = () => patientStates[selected];
  const paintIcons = () => { if (typeof lucide !== 'undefined') lucide.createIcons({ attrs: { width: 19, height: 19 } }); };
  function setScreen(body, actions) { content.innerHTML = body; footer.innerHTML = actions; paintIcons(); }
  function identity() {
    const person = people[selected];
    return `<section class="jmc-patient" aria-label="Current patient"><div class="jmc-token"><small>Token</small>${person.token}</div><div class="jmc-person"><strong>${person.name}</strong><p>${person.age} years / ${person.sex}</p></div>${badge(person.allergy, selected === 0 ? 'shield-alert' : 'shield-question', selected === 0 ? 'jmc-alert' : '')}</section>`;
  }
  function journey(completed = false, pending = false) {
    const active = role === 'nurse' ? 1 : role === 'doctor' ? 2 : 3;
    const steps = [['Arrival','user-check'], ['Vitals','heart-pulse'], ['Consult','stethoscope'], ['Counter','pill']];
    return `<ol class="jmc-journey" aria-label="Patient progress">${steps.map(([label,name], index) => {
      const status = index < active || (completed && index === active && !pending) ? 'done' : index === active && completed && pending ? 'pending' : index === active || (completed && index === active + 1) ? 'active' : 'next';
      const description = status === 'done' ? 'completed' : status === 'active' ? 'current stage' : status === 'pending' ? 'work still pending' : 'not started';
      return `<li data-step="${status}" aria-label="${label}: ${description}"><span class="jmc-step">${icon(status === 'done' ? 'check' : status === 'pending' ? 'clock' : name)}</span><span>${label}</span></li>`;
    }).join('')}</ol>`;
  }
  function facts(rows) { return `<dl class="jmc-facts">${rows.map(([label,value]) => `<div><dt>${label}</dt><dd>${escape(value)}</dd></div>`).join('')}</dl>`; }
  function nextPatient() { return people.findIndex((_, index) => !patientStates[index].outcomes[role]); }
  function nextCard() {
    const next = nextPatient();
    const pending = patientStates.filter(item => item.outcomes[role]?.pending).length;
    const queueEnd = pending ? 'Pending work remains' : role === 'doctor' ? 'Consultation queue complete' : role === 'nurse' ? 'Vitals queue complete' : 'Prescription queue complete';
    return next === -1 ? `<div class="jmc-next"><div class="jmc-next-person"><span class="jmc-avatar ${pending ? 'jmc-wait' : ''}">${icon(pending ? 'clock' : 'list-checks')}</span><div><strong>${queueEnd}</strong><p>${pending ? `${pending} checkouts need follow-up.` : 'Completed tasks remain in the queue.'}</p></div></div>${button('View queue','queue','users',Boolean(pending))}</div>` : `<div class="jmc-next"><div class="jmc-next-person"><span class="jmc-avatar">${icon('user-round')}</span><div><p>Next patient / Token ${people[next].token}</p><strong>${people[next].name}</strong></div></div>${button('Next patient','next','arrow-right',true)}</div>`;
  }
  function queue() {
    const completed = patientStates.filter(item => item.outcomes[role]).length;
    const pending = patientStates.filter(item => item.outcomes[role]?.pending).length;
    const queueSummary = role === 'pharmacy' ? `${people.length - completed} new / ${pending} pending / ${completed - pending} complete` : `${people.length - completed} waiting / ${completed} complete`;
    const directory = view === 'Patients';
    const title = directory ? 'Patients' : role === 'pharmacy' ? 'Prescriptions' : 'Today’s queue';
    const rows = people.map((person,index) => {
      const outcome = patientStates[index].outcomes[role];
      const status = outcome ? outcome.pending ? 'Still pending' : role === 'doctor' ? 'Consultation done' : role === 'nurse' ? 'Vitals saved' : 'Checkout done' : role === 'doctor' ? 'Ready for doctor' : role === 'nurse' ? 'Vitals needed' : 'Ready to supply';
      const label = outcome ? 'View result' : role === 'doctor' ? 'Open consult' : role === 'nurse' ? 'Record vitals' : 'Open counter';
      return `<div class="jmc-queue-row">${outcome ? `<span class="jmc-queue-done ${outcome.pending ? 'jmc-wait' : ''}">${icon(outcome.pending ? 'clock' : 'check')}</span>` : `<div class="jmc-token">${person.token}</div>`}<div><strong>${person.name}</strong><p>${person.age} years / ${person.sex}${outcome ? '' : ` / Waiting ${person.wait}`}</p>${badge(status, outcome ? outcome.pending ? 'clock' : 'check' : 'clock', outcome && !outcome.pending ? '' : 'jmc-wait')}</div>${button(label,'open',outcome ? 'circle-check' : role === 'doctor' ? 'stethoscope' : role === 'nurse' ? 'heart-pulse' : 'pill', !outcome && index === nextPatient(), `data-patient="${index}"`)}</div>`;
    }).join('');
    setScreen(heading(title, queueSummary) + `<div class="jmc-sheet">${rows}</div>`, `<p class="jmc-save-status">${icon('list-checks')}Completed actions stay marked in the queue.</p>`);
  }
  function consultation() {
    const draft = state().draft;
    setScreen(heading('Consultation','',badge('Unsigned draft','file-pen-line')) + identity() + journey() +
      `<div class="jmc-sheet"><section class="jmc-section"><div class="jmc-section-heading"><h3>${icon('clipboard-pen')}Today’s visit</h3></div><label class="jmc-field">Complaint<input data-draft="complaint" value="${escape(draft.complaint)}" placeholder="Search or describe the complaint"></label><label class="jmc-field">Diagnosis<input data-draft="diagnosis" value="${escape(draft.diagnosis)}" placeholder="Search or enter a diagnosis"></label><details style="margin-top:10px"><summary>${icon('notebook-pen')}Examination &amp; notes</summary><label class="jmc-field">Clinical note<textarea rows="2" data-draft="note">${escape(draft.note)}</textarea></label></details></section><section class="jmc-section"><div class="jmc-section-heading"><h3>${icon('pill')}Prescription</h3></div><p class="jmc-muted">No medicines prescribed for this example visit.</p></section><details class="jmc-section jmc-details"><summary>${icon('history')}Previous visit</summary><p>5 September 2026. Follow-up requested after one week.</p></details><details class="jmc-section jmc-details"><summary>${icon('calendar-check')}Follow-up: <span data-followup-label>${draft.followUp}</span></summary><div class="jmc-chips">${['3 days','7 days','14 days','No follow-up'].map(value => `<button type="button" data-followup="${value}" aria-pressed="${draft.followUp === value}">${value}</button>`).join('')}</div></details></div>`,
      `<p class="jmc-save-status" data-saved="${draft.saved}" role="status">${icon(draft.saved ? 'circle-check' : 'file-pen-line')}${draft.saved ? 'Draft saved · Still unsigned' : 'Unsaved draft'}</p><div class="jmc-footer-actions">${button(draft.saved ? 'Saved' : 'Save draft','save-draft',draft.saved ? 'check' : 'save')}${button('Review & finish','review','arrow-right',true)}</div>`);
  }
  function vitals() {
    const values = state().vitals;
    const fields = [['bp','Blood pressure','mmHg','gauge'],['temperature','Temperature','°C','thermometer'],['pulse','Pulse','/min','heart-pulse'],['spo2','SpO₂','%','droplets']];
    setScreen(heading('Record vitals') + identity() + journey() + `<div class="jmc-sheet"><section class="jmc-section"><div class="jmc-pair">${fields.map(([key,label,unit,name]) => `<label class="jmc-field"><span class="jmc-vital-label">${icon(name)}${label} (${unit})</span><input data-vital="${key}" inputmode="${key === 'bp' ? 'text' : 'decimal'}" value="${escape(values[key])}" placeholder="Not measured"></label>`).join('')}</div><details style="margin-top:13px"><summary>${icon('message-square-text')}Note about missing readings</summary><label class="jmc-field">Optional note<textarea rows="2" data-vital="reason" placeholder="Why a reading was not taken">${escape(values.reason)}</textarea></label></details></section></div>`, `<p class="jmc-save-status">${icon('info')}Empty readings stay “Not measured”.</p><div class="jmc-footer-actions">${button('Queue','queue','users')}${button('Save vitals','finish','check',true)}</div>`);
  }
  function amountDue() { return fee + state().counter.quantity * 2; }
  function amountReceived() {
    const data = state().counter;
    return data.method === 'Pay later' ? 0 : data.method === 'Split' ? Number(data.cash) + Number(data.upi) : Number(data.received);
  }
  function paymentFields() {
    const data = state().counter;
    if (data.method === 'Pay later') return `<p class="jmc-small jmc-muted">The full amount stays due.</p>`;
    if (data.method === 'Split') return `<div class="jmc-pair"><label class="jmc-field">Cash received (₹)<input data-counter="cash" type="number" inputmode="decimal" min="0" step="0.01" max="${amountDue()}" value="${data.cash}"></label><label class="jmc-field">UPI received (₹)<input data-counter="upi" type="number" inputmode="decimal" min="0" step="0.01" max="${amountDue()}" value="${data.upi}"></label></div>`;
    return `<label class="jmc-field">Amount received (₹)<input data-counter="received" type="number" inputmode="decimal" min="0" step="0.01" max="${amountDue()}" value="${data.received}"></label>`;
  }
  function counter() {
    const data = state().counter;
    setScreen(heading('Pharmacy counter') + identity() + journey() + `<div class="jmc-work"><div class="jmc-sheet"><section class="jmc-section"><div class="jmc-section-heading"><h3>${icon('pill')}Medicines to give</h3></div><div class="jmc-medicine"><span class="jmc-avatar">${icon('pill')}</span><div><strong>Paracetamol 500 mg</strong><p>Tablet / 10 prescribed</p></div></div><label class="jmc-field">Give now (tablets)<input data-counter="quantity" aria-label="Tablets to give now" type="number" inputmode="numeric" min="0" max="10" step="1" value="${data.quantity}"></label><p class="jmc-small jmc-muted" data-remaining style="margin-top:8px">${10 - data.quantity} tablets remaining</p><details style="margin-top:8px"><summary>${icon('package-check')}Batch &amp; expiry</summary><p class="jmc-small jmc-muted">EX-001 / Expires March 2027</p></details></section><section class="jmc-section"><h3>Payment</h3><div class="jmc-chips">${[['Cash','banknote'],['UPI','qr-code'],['Split','split'],['Pay later','clock']].map(([method,name]) => `<button type="button" data-method="${method}" aria-pressed="${data.method === method}"><span style="display:flex;align-items:center;gap:6px">${icon(name)}${method}</span></button>`).join('')}</div><div data-payment-fields style="margin-top:15px">${paymentFields()}</div></section></div><aside class="jmc-bill"><h3>${icon('receipt-text')}Bill</h3><div class="jmc-money-row"><span>Consultation</span><strong>${money(fee)}</strong></div><div class="jmc-money-row"><span>Medicines</span><strong data-medicine-total>${money(data.quantity * 2)}</strong></div><div class="jmc-money-row jmc-total"><span>Total</span><strong data-total>${money(amountDue())}</strong></div></aside></div>`, `<p class="jmc-save-status">${icon('clipboard-check')}Review before recording.</p><div class="jmc-footer-actions">${button('Prescriptions','queue','clipboard-list')}${button('Review checkout','review','arrow-right',true)}</div>`);
  }
  function review() {
    const pharmacy = role === 'pharmacy';
    const data = state().counter;
    const received = amountReceived();
    const due = Math.round((amountDue() - received) * 100) / 100;
    const rows = pharmacy ? [['Medicine supply',`${data.quantity} of 10 tablets`],['Consultation fee',money(fee)],['Bill total',money(amountDue())],['Payment method',data.method],['Amount received',money(received)],['Balance remaining',money(due)]] : [['Complaint',state().draft.complaint || 'Not recorded'],['Diagnosis',state().draft.diagnosis || 'Not recorded'],['Prescription','No medicines prescribed'],['Follow-up',state().draft.followUp]];
    setScreen(heading(pharmacy ? 'Review checkout' : 'Review consultation') + identity() + `<section class="jmc-outcome"><span class="jmc-outcome-mark">${icon(pharmacy ? 'receipt-text' : 'clipboard-check')}</span><h3>${pharmacy ? 'Check supply and payment' : 'Ready to finish this visit?'}</h3>${facts(rows)}${pharmacy && due > 0 ? `<div class="jmc-pending">${icon('clock')}Payment will remain pending: ${money(due)}.</div>` : ''}</section>`, `<p class="jmc-save-status">${icon('info')}Example data · Nothing is submitted to the clinic.</p><div class="jmc-footer-actions">${button('Back to edit','edit','arrow-left')}${button(pharmacy ? 'Confirm checkout' : 'Finish consultation','finish','check',true)}</div>`);
  }
  function complete() {
    const result = state().outcomes[role];
    const person = people[selected];
    let title, subtitle, rows;
    if (role === 'doctor') {
      title = 'Consultation completed'; subtitle = 'The patient is ready for the pharmacy counter.';
      rows = [['Visit note','Saved'],['Prescription','No medicines prescribed'],['Next step','Consultation fee at counter']];
    } else if (role === 'nurse') {
      title = 'Vitals saved'; subtitle = 'The doctor can continue this patient’s visit.';
      const values = state().vitals;
      const measured = ['bp','temperature','pulse','spo2'].filter(key => values[key].trim()).length;
      rows = [['Readings recorded',`${measured} of 4`],['Not measured',`${4 - measured} readings`],['Next step','Ready for doctor']];
    } else {
      title = result.received === 0 ? 'Payment pending' : result.balance > 0 ? 'Part payment received' : 'Payment received';
      subtitle = result.received === 0 ? 'The checkout is recorded. The amount is still due.' : result.balance > 0 ? 'The remaining balance stays on the patient’s bill.' : 'This bill has no outstanding balance.';
      rows = [['Medicine supply',`${result.quantity} of 10 tablets`],['Amount received',money(result.received)],['Balance due',money(result.balance)]];
    }
    const paymentPending = role === 'pharmacy' && result.balance > 0;
    const noPayment = role === 'pharmacy' && result.received === 0;
    const medicinePending = role === 'pharmacy' && result.quantity < 10;
    setScreen(journey(true, result.pending) + `<section class="jmc-outcome" aria-label="Task result"><span class="jmc-outcome-mark ${noPayment ? 'jmc-wait' : ''}" aria-hidden="true">${icon(noPayment ? 'clock' : 'check')}</span><div role="status" aria-live="polite" aria-atomic="true"><h2>${title}</h2><p class="jmc-outcome-patient">${person.name} / Token ${person.token}</p><p class="jmc-outcome-sub">${subtitle}</p></div>${facts(rows)}${paymentPending || medicinePending ? `<div class="jmc-pending">${icon('circle-alert')}<span>${paymentPending ? `${money(result.balance)} still due.` : ''}${paymentPending && medicinePending ? '<br>' : ''}${medicinePending ? `${10 - result.quantity} tablets still pending.` : ''}</span></div>` : ''}</section>${nextCard()}`, `<p class="jmc-save-status" data-saved="true">${icon(result.pending ? 'clock' : 'circle-check')}${result.pending ? 'Pending items remain visible in the queue.' : 'This task is complete.'}</p><div class="jmc-footer-actions">${button('View queue','queue','users')}${role === 'doctor' ? button('Visit summary','summary','file-text') : ''}</div>`);
  }
  function observation() {
    setScreen(heading('Observation','1 occupied / 3 available') + `<div class="jmc-bed-grid">${[1,2,3,4].map(bed => `<section class="jmc-bed">${icon('bed-single')}<h3>Bed ${bed}</h3><p>${bed === 1 ? 'Meena S. / 58 years' : 'Available'}</p>${bed === 1 ? badge('Check in 10 min','clock','jmc-wait') : badge('Ready for a patient','check')}</section>`).join('')}</div>`, `<p class="jmc-save-status">${icon('heart-pulse')}Observation board</p>${button('Back to queue','queue','users')}`);
  }
  function stock() {
    setScreen(heading('Stock attention','1 item needs attention') + `<div class="jmc-sheet"><section class="jmc-section"><div class="jmc-section-heading"><h3>${icon('package-search')}Low stock</h3>${badge('Reorder','triangle-alert','jmc-wait')}</div><div class="jmc-medicine"><span class="jmc-avatar">${icon('pill')}</span><div><strong>Paracetamol 500 mg tablet</strong><p>18 available / Reorder level 30</p></div></div></section><section class="jmc-section"><div class="jmc-section-heading"><h3>${icon('calendar-check')}Expiry</h3>${badge('No action needed','check')}</div><p class="jmc-small jmc-muted">No example batches expire in the next 30 days.</p></section><details class="jmc-section jmc-details"><summary>${icon('package-plus')}Receiving &amp; stock counts</summary><p>Occasional stock tasks stay here. Full configuration and reports stay in admin.</p></details></div>`, `<p class="jmc-save-status">${icon('package-check')}Only stock that needs your attention.</p>${button('Prescriptions','queue','clipboard-list')}`);
  }
  function render() {
    const activeView = ['Result','Review'].includes(view) ? navigation[role][1][0] : view;
    nav.innerHTML = navigation[role].map(([label,name]) => `<button type="button" data-view="${label}" ${label === activeView ? 'aria-current="page"' : ''}>${icon(name)}<span>${label}</span></button>`).join('');
    if (view === 'Result') complete();
    else if (view === 'Review') review();
    else if (view === 'Consult') consultation();
    else if (view === 'Vitals') vitals();
    else if (view === 'Counter') counter();
    else if (view === 'Observation') observation();
    else if (view === 'Stock') stock();
    else queue();
  }
  function navigate(next) {
    if (busy) return;
    view = next === navigation[role][1][0] && state().outcomes[role] ? 'Result' : next;
    render();
  }
  function error(message) {
    let box = content.querySelector('.jmc-error');
    if (!box) { box = document.createElement('div'); box.className = 'jmc-error'; box.setAttribute('role','alert'); content.prepend(box); }
    box.innerHTML = icon('circle-alert') + `<span>${escape(message)}</span>`;
    paintIcons();
  }
  function validateCounter() {
    for (const input of content.querySelectorAll('input[type="number"]')) if (!input.reportValidity()) return false;
    const data = state().counter;
    if (!Number.isInteger(data.quantity) || data.quantity < 0 || data.quantity > 10) { error('Enter a whole number from 0 to 10 tablets.'); return false; }
    const received = amountReceived();
    if (!Number.isFinite(received) || received < 0 || received > amountDue()) { error('The payment must be between zero and the bill total.'); return false; }
    if (data.method !== 'Pay later' && received === 0) { error('Enter the amount received, or choose Pay later.'); return false; }
    return true;
  }
  function markDraftChanged() {
    state().draft.saved = false;
    const status = footer.querySelector('.jmc-save-status');
    if (status) { status.dataset.saved = 'false'; status.innerHTML = icon('file-pen-line') + 'Unsaved draft'; }
    const save = footer.querySelector('[data-action="save-draft"]');
    if (save) save.innerHTML = icon('save') + '<span>Save draft</span>';
    paintIcons();
  }
  function finish(target) {
    if (busy || state().outcomes[role]) return;
    if (role === 'pharmacy' && !validateCounter()) return;
    const completedRole = role;
    const completedPatient = selected;
    busy = true;
    target.disabled = true;
    target.classList.add('jmc-busy');
    target.innerHTML = icon('loader-circle') + '<span>Saving…</span>';
    root.querySelectorAll('button,input,select,textarea').forEach(item => item.disabled = true);
    paintIcons();
    setTimeout(() => {
      const current = patientStates[completedPatient];
      if (completedRole === 'pharmacy') {
        const received = amountReceived();
        const balance = Math.round((amountDue() - received) * 100) / 100;
        current.outcomes.pharmacy = { received, balance, quantity: current.counter.quantity, pending: balance > 0 || current.counter.quantity < 10 };
      } else current.outcomes[completedRole] = { pending: false };
      busy = false;
      roleSelect.disabled = false;
      view = 'Result';
      render();
      const outcomeTitle = content.querySelector('.jmc-outcome h2').textContent;
      root.querySelector('[data-announcement]').textContent = `${outcomeTitle}. ${people[completedPatient].name}, token ${people[completedPatient].token}. ${current.outcomes[completedRole].pending ? 'Some work is still pending.' : 'This task is complete.'}`;
      content.querySelector('[data-action="next"]')?.focus({ preventScroll: true });
    }, 450);
  }
  roleSelect.addEventListener('change', () => { if (busy) return; role = roleSelect.value; selected = 0; view = navigation[role][0][0]; render(); });
  root.addEventListener('input', event => {
    const input = event.target;
    if (input.dataset.draft) { state().draft[input.dataset.draft] = input.value; markDraftChanged(); }
    if (input.dataset.vital) state().vitals[input.dataset.vital] = input.value;
    if (input.dataset.counter) {
      const field = input.dataset.counter;
      const oldTotal = amountDue();
      state().counter[field] = input.value === '' ? NaN : Number(input.value);
      if (field === 'quantity' && input.validity.valid && input.value !== '') {
        const data = state().counter;
        if (data.received === oldTotal) data.received = amountDue();
        if (data.cash + data.upi === oldTotal) { data.cash = amountDue() / 2; data.upi = amountDue() / 2; }
        content.querySelector('[data-remaining]').textContent = `${10 - data.quantity} tablets remaining`;
        content.querySelector('[data-medicine-total]').textContent = money(data.quantity * 2);
        content.querySelector('[data-total]').textContent = money(amountDue());
        content.querySelector('[data-payment-fields]').innerHTML = paymentFields();
      }
    }
  });
  root.addEventListener('click', event => {
    const target = event.target.closest('button');
    if (!target || !root.contains(target) || busy) return;
    if (target.dataset.view) { navigate(target.dataset.view); return; }
    if (target.dataset.followup) { state().draft.followUp = target.dataset.followup; root.querySelector('[data-followup-label]').textContent = target.dataset.followup; root.querySelectorAll('[data-followup]').forEach(item => item.setAttribute('aria-pressed',String(item.dataset.followup === target.dataset.followup))); markDraftChanged(); return; }
    if (target.dataset.method) { state().counter.method = target.dataset.method; root.querySelectorAll('[data-method]').forEach(item => item.setAttribute('aria-pressed',String(item.dataset.method === target.dataset.method))); content.querySelector('[data-payment-fields]').innerHTML = paymentFields(); return; }
    const action = target.dataset.action;
    if (action === 'open') { selected = Number(target.dataset.patient); navigate(navigation[role][1][0]); }
    if (action === 'queue') navigate(navigation[role][0][0]);
    if (action === 'next') { const next = nextPatient(); if (next !== -1) { selected = next; navigate(navigation[role][1][0]); } }
    if (action === 'save-draft') { state().draft.saved = true; target.innerHTML = icon('check') + '<span>Saved</span>'; const status = footer.querySelector('.jmc-save-status'); status.dataset.saved = 'true'; status.innerHTML = icon('circle-check') + 'Draft saved · Still unsigned'; paintIcons(); }
    if (action === 'review') { if (role !== 'pharmacy' || validateCounter()) navigate('Review'); }
    if (action === 'edit') navigate(navigation[role][1][0]);
    if (action === 'finish') finish(target);
    if (action === 'summary') { setScreen(heading('Completed visit') + identity() + `<section class="jmc-outcome"><span class="jmc-outcome-mark">${icon('file-check-2')}</span><h3>Visit summary</h3>${facts([['Complaint',state().draft.complaint || 'Not recorded'],['Diagnosis',state().draft.diagnosis || 'Not recorded'],['Prescription','No medicines prescribed'],['Follow-up',state().draft.followUp]])}</section>`, button('Back to result','result','arrow-left')); }
    if (action === 'result') navigate('Result');
  });
  render();
})();
</script>
